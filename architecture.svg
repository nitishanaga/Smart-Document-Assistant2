<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="820" viewBox="0 0 1400 820" role="img" aria-labelledby="title desc">
  <title id="title">Smart Document Assistant architecture</title>
  <desc id="desc">Streamlit uploads documents into local extraction and retrieval. Gemini Flash-Lite is the primary language model, Groq is the fallback, and local extraction is the final fallback.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#101c24"/>
      <stop offset="1" stop-color="#1b2b2e"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0" stop-color="#20363d"/>
      <stop offset="1" stop-color="#17262d"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#000" flood-opacity=".28"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#8fe8d0"/>
    </marker>
    <style>
      .title { font: 700 34px 'Segoe UI', sans-serif; fill: #f5f1e8; }
      .section { font: 700 17px 'Segoe UI', sans-serif; fill: #8fe8d0; letter-spacing: 1px; }
      .label { font: 600 18px 'Segoe UI', sans-serif; fill: #f5f1e8; }
      .small { font: 400 15px 'Segoe UI', sans-serif; fill: #b8c7c8; }
      .provider { font: 700 19px 'Segoe UI', sans-serif; fill: #f5f1e8; }
      .arrow { stroke: #8fe8d0; stroke-width: 3; fill: none; marker-end: url(#arrow); }
      .dashed { stroke: #ffb38f; stroke-width: 3; fill: none; stroke-dasharray: 9 8; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1400" height="820" rx="24" fill="url(#bg)"/>
  <text x="700" y="58" text-anchor="middle" class="title">SMART DOCUMENT ASSISTANT SYSTEM ARCHITECTURE</text>

  <rect x="38" y="92" width="1324" height="170" rx="18" fill="url(#panel)" stroke="#5c8e9b" stroke-width="2" filter="url(#shadow)"/>
  <text x="68" y="128" class="section">STREAMLIT UI AND APPLICATION</text>
  <rect x="68" y="154" width="265" height="70" rx="12" fill="#263f48" stroke="#8db9c4" stroke-width="2"/>
  <text x="200" y="184" text-anchor="middle" class="label">Upload documents</text>
  <text x="200" y="207" text-anchor="middle" class="small">PDF, DOCX, PPTX, Excel, text</text>
  <rect x="405" y="154" width="265" height="70" rx="12" fill="#263f48" stroke="#8db9c4" stroke-width="2"/>
  <text x="537" y="184" text-anchor="middle" class="label">User question</text>
  <text x="537" y="207" text-anchor="middle" class="small">Single or multi-document</text>
  <rect x="742" y="154" width="270" height="70" rx="12" fill="#263f48" stroke="#8db9c4" stroke-width="2"/>
  <text x="877" y="184" text-anchor="middle" class="label">Answer and study tabs</text>
  <text x="877" y="207" text-anchor="middle" class="small">Sources, summary, mind map, cards</text>
  <rect x="1084" y="154" width="238" height="70" rx="12" fill="#263f48" stroke="#8db9c4" stroke-width="2"/>
  <text x="1203" y="184" text-anchor="middle" class="label">Session state</text>
  <text x="1203" y="207" text-anchor="middle" class="small">Conversation and caches</text>

  <rect x="38" y="300" width="1324" height="190" rx="18" fill="#28273d" stroke="#8277b6" stroke-width="2" filter="url(#shadow)"/>
  <text x="68" y="337" class="section" fill="#c0b5ff">LOCAL DOCUMENT PROCESSING</text>
  <rect x="68" y="365" width="280" height="78" rx="12" fill="#302f4e" stroke="#a49adb" stroke-width="2"/>
  <text x="208" y="397" text-anchor="middle" class="label">Format extraction</text>
  <text x="208" y="420" text-anchor="middle" class="small">Text plus page/slide/sheet metadata</text>
  <rect x="405" y="365" width="280" height="78" rx="12" fill="#302f4e" stroke="#a49adb" stroke-width="2"/>
  <text x="545" y="397" text-anchor="middle" class="label">Chunking and normalization</text>
  <text x="545" y="420" text-anchor="middle" class="small">Overlap, paragraph ranges, word forms</text>
  <rect x="742" y="365" width="280" height="78" rx="12" fill="#302f4e" stroke="#a49adb" stroke-width="2"/>
  <text x="882" y="397" text-anchor="middle" class="label">Hybrid retrieval</text>
  <text x="882" y="420" text-anchor="middle" class="small">Token hash cosine plus lexical overlap</text>
  <rect x="1078" y="365" width="244" height="78" rx="12" fill="#302f4e" stroke="#a49adb" stroke-width="2"/>
  <text x="1200" y="397" text-anchor="middle" class="label">Evidence context</text>
  <text x="1200" y="420" text-anchor="middle" class="small">Numbered excerpts and neighbors</text>

  <rect x="38" y="528" width="420" height="220" rx="18" fill="#302a27" stroke="#d29d65" stroke-width="2" filter="url(#shadow)"/>
  <text x="68" y="566" class="section" fill="#ffd18e">PERSISTENT IN-MEMORY LIBRARY</text>
  <text x="68" y="610" class="label">Normalized document chunks</text>
  <text x="68" y="640" class="small">Deterministic local vectors</text>
  <text x="68" y="668" class="small">Cross-document evidence coverage</text>
  <text x="68" y="696" class="small">No native numerical dependency</text>

  <rect x="510" y="528" width="812" height="220" rx="18" fill="#193436" stroke="#62cdbd" stroke-width="2" filter="url(#shadow)"/>
  <text x="542" y="566" class="section">LLM GENERATION AND FALLBACKS</text>
  <rect x="542" y="600" width="220" height="96" rx="14" fill="#235b55" stroke="#8fe8d0" stroke-width="2"/>
  <text x="652" y="636" text-anchor="middle" class="provider">1. Gemini</text>
  <text x="652" y="662" text-anchor="middle" class="small">gemini-3.5-flash-lite</text>
  <text x="652" y="684" text-anchor="middle" class="small">Primary free-tier model</text>
  <rect x="805" y="600" width="220" height="96" rx="14" fill="#4b3c35" stroke="#ffb38f" stroke-width="2"/>
  <text x="915" y="636" text-anchor="middle" class="provider">2. Groq</text>
  <text x="915" y="662" text-anchor="middle" class="small">llama-3.1-8b-instant</text>
  <text x="915" y="684" text-anchor="middle" class="small">Fallback when Gemini fails</text>
  <rect x="1068" y="600" width="220" height="96" rx="14" fill="#3a3740" stroke="#c9bddf" stroke-width="2"/>
  <text x="1178" y="636" text-anchor="middle" class="provider">3. Local</text>
  <text x="1178" y="662" text-anchor="middle" class="small">Extractive answer</text>
  <text x="1178" y="684" text-anchor="middle" class="small">Final offline fallback</text>

  <path d="M200 224 L200 365" class="arrow"/>
  <path d="M545 224 L545 365" class="arrow"/>
  <path d="M208 443 L208 528" class="arrow"/>
  <path d="M685 404 L742 404" class="arrow"/>
  <path d="M1022 404 L1078 404" class="arrow"/>
  <path d="M1200 443 C1200 505 650 505 650 600" class="arrow"/>
  <path d="M762 648 L805 648" class="dashed"/>
  <path d="M1025 648 L1068 648" class="dashed"/>
  <path d="M652 600 C652 520 545 490 545 443" class="arrow"/>
  <path d="M877 224 L877 365" class="arrow"/>
</svg>
